<!-- SUBSTITUA APENAS O CSS E O HTML DO PATO POR ESSE -->

<style>

/* PATO */
#pato{
    position:fixed;
    left:100px;
    top:100px;

    width:90px;
    height:90px;

    z-index:9999;

    transition:
    left 0.15s linear,
    top 0.15s linear;
}

/* CORPO */
.corpo{
    position:absolute;

    width:55px;
    height:55px;

    background:#ffd54f;
    border-radius:50%;

    top:20px;
    left:18px;
}

/* CABEÇA */
.cabeca{
    position:absolute;

    width:38px;
    height:38px;

    background:#ffe082;
    border-radius:50%;

    top:5px;
    left:42px;
}

/* OLHO */
.olho{
    position:absolute;

    width:5px;
    height:5px;

    background:black;
    border-radius:50%;

    top:15px;
    left:24px;
}

/* BICO */
.bico{
    position:absolute;

    width:18px;
    height:10px;

    background:orange;

    border-radius:10px;

    top:20px;
    left:30px;
}

/* PERNAS */
.perna{
    position:absolute;

    width:4px;
    height:20px;

    background:orange;

    bottom:2px;

    animation:andar 0.2s infinite alternate;
}

.perna1{
    left:32px;
}

.perna2{
    left:48px;
    animation-delay:0.2s;
}

/* PÉS */
.pe{
    position:absolute;

    width:14px;
    height:4px;

    background:orange;

    bottom:-2px;
    left:-5px;

    border-radius:10px;
}

/* ANIMAÇÃO */
@keyframes andar{

    from{
        transform:rotate(20deg);
    }

    to{
        transform:rotate(-20deg);
    }

}

</style>

<!-- PATO -->
<div id="pato">

    <div class="corpo"></div>

    <div class="cabeca">
        <div class="olho"></div>
        <div class="bico"></div>
    </div>

    <div class="perna perna1">
        <div class="pe"></div>
    </div>

    <div class="perna perna2">
        <div class="pe"></div>
    </div>

</div>
