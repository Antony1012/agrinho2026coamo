<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pato Brincando com o Mouse</title>

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* BODY */
body{
    overflow:hidden;
    height:100vh;
    background:linear-gradient(#87CEEB,#dff5ff);
    font-family:Arial,sans-serif;
}

/* TEXTO */
h1{
    text-align:center;
    margin-top:40px;
    color:white;
    font-size:3rem;
}

p{
    text-align:center;
    color:white;
    margin-top:10px;
    font-size:1.2rem;
}

/* PATO */
#pato{
    position:fixed;
    left:100px;
    top:100px;

    font-size:80px;

    z-index:9999;

    transition:
    left 0.25s linear,
    top 0.25s linear,
    transform 0.2s;
}

/* PARTÍCULAS */
.particula{
    position:fixed;
    font-size:20px;
    pointer-events:none;

    animation:sumir 1s forwards;
}

@keyframes sumir{

    from{
        opacity:1;
        transform:translateY(0px);
    }

    to{
        opacity:0;
        transform:translateY(-40px);
    }

}

</style>
</head>

<body>

<h1>🦆 Pato Maluco</h1>

<p>
Ele está brincando com o cursor do mouse.
</p>

<div id="pato">🦆</div>

<script>

const pato = document.getElementById("pato");

let mouseX = 0;
let mouseY = 0;

let patoX = 100;
let patoY = 100;

/* PEGAR POSIÇÃO DO MOUSE */
document.addEventListener("mousemove", (e)=>{

    mouseX = e.clientX;
    mouseY = e.clientY;

});

/* CRIAR PARTÍCULAS */
function criarParticula(x,y){

    const p = document.createElement("div");

    p.classList.add("particula");

    p.innerHTML = "💨";

    p.style.left = x + "px";
    p.style.top = y + "px";

    document.body.appendChild(p);

    setTimeout(()=>{
        p.remove();
    },1000);

}

/* IA DO PATO */
function atualizar(){

    let dx = mouseX - patoX;
    let dy = mouseY - patoY;

    let distancia = Math.sqrt(dx*dx + dy*dy);

    /* segue o mouse */
    if(distancia > 120){

        patoX += dx * 0.03;
        patoY += dy * 0.03;

    }

    /* foge quando chega perto */
    if(distancia < 100){

        patoX -= dx * 0.08;
        patoY -= dy * 0.08;

        criarParticula(patoX,patoY);

    }

    /* gira */
    if(dx < 0){
        pato.style.transform = "scaleX(-1)";
    }else{
        pato.style.transform = "scaleX(1)";
    }

    pato.style.left = patoX + "px";
    pato.style.top = patoY + "px";

    requestAnimationFrame(atualizar);

}

atualizar();

</script>

</body>
</html>
