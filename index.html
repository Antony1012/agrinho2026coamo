<!-- PATO -->
<style>

#pato{
    position:fixed;
    left:100px;
    top:100px;

    width:90px;
    height:90px;

    z-index:9999;

    transition:
    left 0.12s linear,
    top 0.12s linear;

    animation:balanco 0.4s infinite alternate;
}

/* Corpo */
.corpo{
    position:absolute;
    width:55px;
    height:55px;
    background:#ffd54f;
    border-radius:50%;
    top:20px;
    left:18px;
}

/* Cabeça */
.cabeca{
    position:absolute;
    width:38px;
    height:38px;
    background:#ffe082;
    border-radius:50%;
    top:5px;
    left:42px;

    animation:cabecaMove 0.4s infinite alternate;
}

/* Olhos */
.olho{
    position:absolute;
    width:5px;
    height:5px;
    background:black;
    border-radius:50%;
    top:15px;

    animation:piscar 4s infinite;
}

.olho1{
    left:16px;
}

.olho2{
    left:24px;
}

/* Bico */
.bico{
    position:absolute;
    width:18px;
    height:10px;
    background:orange;
    border-radius:10px;
    top:20px;
    left:30px;
}

/* Pernas */
.perna{
    position:absolute;
    width:4px;
    height:20px;
    background:orange;
    bottom:2px;

    transform-origin:top center;

    animation:andar 0.15s infinite alternate;
}

.perna1{
    left:32px;
}

.perna2{
    left:48px;
    animation-delay:0.15s;
}

/* Pés */
.pe{
    position:absolute;
    width:14px;
    height:4px;
    background:orange;
    bottom:-2px;
    left:-5px;
    border-radius:10px;
}

/* Corpo balançando */
@keyframes balanco{
    from{
        transform:translateY(0px) rotate(-3deg);
    }
    to{
        transform:translateY(-4px) rotate(3deg);
    }
}

/* Cabeça mexendo */
@keyframes cabecaMove{
    from{
        transform:rotate(-5deg);
    }
    to{
        transform:rotate(5deg);
    }
}

/* Pernas */
@keyframes andar{
    from{
        transform:rotate(35deg);
    }
    to{
        transform:rotate(-35deg);
    }
}

/* Piscar */
@keyframes piscar{
    0%,95%,100%{
        height:5px;
    }
    97%{
        height:1px;
    }
}

/* Partículas */
.particula{
    position:fixed;
    font-size:20px;
    pointer-events:none;
    animation:sumir 1s forwards;
}

@keyframes sumir{
    from{
        opacity:1;
        transform:translateY(0px);
    }
    to{
        opacity:0;
        transform:translateY(-40px);
    }
}

</style>

<div id="pato">

    <div class="corpo"></div>

    <div class="cabeca">
        <div class="olho olho1"></div>
        <div class="olho olho2"></div>
        <div class="bico"></div>
    </div>

    <div class="perna perna1">
        <div class="pe"></div>
    </div>

    <div class="perna perna2">
        <div class="pe"></div>
    </div>

</div>

<script>

const pato = document.getElementById("pato");

let mouseX = 0;
let mouseY = 0;

let patoX = 100;
let patoY = 100;

document.addEventListener("mousemove", (e)=>{

    mouseX = e.clientX;
    mouseY = e.clientY;

});

function criarParticula(x,y){

    const p = document.createElement("div");

    p.classList.add("particula");
    p.innerHTML = "💨";

    p.style.left = x + "px";
    p.style.top = y + "px";

    document.body.appendChild(p);

    setTimeout(()=>{
        p.remove();
    },1000);

}

function atualizar(){

    let dx = mouseX - patoX;
    let dy = mouseY - patoY;

    let distancia = Math.sqrt(dx*dx + dy*dy);

    if(distancia > 120){

        patoX += dx * 0.03;
        patoY += dy * 0.03;

    }

    if(distancia < 100){

        patoX -= dx * 0.08;
        patoY -= dy * 0.08;

        if(Math.random() < 0.08){
            criarParticula(patoX,patoY);
        }

    }

    patoX = Math.max(0, Math.min(window.innerWidth - 90, patoX));
    patoY = Math.max(0, Math.min(window.innerHeight - 90, patoY));

    if(dx < 0){
        pato.style.scale = "-1 1";
    }else{
        pato.style.scale = "1 1";
    }

    pato.style.left = patoX + "px";
    pato.style.top = patoY + "px";

    requestAnimationFrame(atualizar);

}

atualizar();

</script>
