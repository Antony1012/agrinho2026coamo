<script>

const pato = document.getElementById("pato");

let mouseX = 0;
let mouseY = 0;

let patoX = 100;
let patoY = 100;

let direcao = 1;
let passo = 0;

/* POSIÇÃO DO MOUSE */
document.addEventListener("mousemove", (e)=>{

    mouseX = e.clientX;
    mouseY = e.clientY;

});

/* PARTÍCULAS */
function criarParticula(x,y){

    const p = document.createElement("div");

    p.classList.add("particula");

    p.innerHTML = "💨";

    p.style.left = x + "px";
    p.style.top = y + "px";

    document.body.appendChild(p);

    setTimeout(()=>{
        p.remove();
    },1000);

}

/* IA DO PATO */
function atualizar(){

    let dx = mouseX - patoX;
    let dy = mouseY - patoY;

    let distancia = Math.sqrt(dx*dx + dy*dy);

    /* mais lento */
    if(distancia > 120){

        patoX += dx * 0.015;
        patoY += dy * 0.015;

    }

    /* foge quando chega perto */
    if(distancia < 100){

        patoX -= dx * 0.04;
        patoY -= dy * 0.04;

        if(Math.random() < 0.03){
            criarParticula(patoX,patoY);
        }

    }

    /* limites */
    patoX = Math.max(0, Math.min(window.innerWidth - 90, patoX));
    patoY = Math.max(0, Math.min(window.innerHeight - 90, patoY));

    /* direção */
    if(dx < 0){
        direcao = -1;
    }else{
        direcao = 1;
    }

    /* animação de caminhada */
    passo += 0.15;

    const balanco = Math.sin(passo) * 3;
    const sobeDesce = Math.abs(Math.sin(passo)) * 4;

    pato.style.transform =
        `translateY(${-sobeDesce}px)
         rotate(${balanco}deg)
         scaleX(${direcao})`;

    pato.style.left = patoX + "px";
    pato.style.top = patoY + "px";

    requestAnimationFrame(atualizar);

}

atualizar();

</script>
