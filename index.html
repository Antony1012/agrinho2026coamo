<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pato Andando</title>

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* BODY */
body{
    height:100vh;
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:linear-gradient(#87CEEB 70%, #4CAF50 30%);
}

/* TÍTULO */
h1{
    text-align:center;
    margin-top:40px;
    color:white;
    font-size:3rem;
    text-shadow:2px 2px 5px rgba(0,0,0,0.3);
}

/* TEXTO */
p{
    text-align:center;
    color:white;
    font-size:1.2rem;
    margin-top:10px;
}

/* PATO */
#pato{
    position:absolute;
    bottom:80px;
    left:-150px;
    font-size:100px;

    animation:pular 0.5s infinite alternate;
}

/* ANIMAÇÃO */
@keyframes pular{

    from{
        transform:translateY(0px);
    }

    to{
        transform:translateY(-12px);
    }

}

</style>
</head>

<body>

<h1>🦆 Pato andando no site</h1>

<p>
O pato não sabe pra onde vai.
Mas ele continua.
</p>

<div id="pato">🦆</div>

<script>

const pato = document.getElementById("pato");

let posicao = -150;

function andar(){

    posicao += 4;

    pato.style.left = posicao + "px";

    // reinicia quando sai da tela
    if(posicao > window.innerWidth){
        posicao = -150;
    }

    requestAnimationFrame(andar);
}

andar();

</script>

</body>
</html>
