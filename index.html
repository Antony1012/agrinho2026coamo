<!-- PATO -->
<style>

#pato{
    position:fixed;
    left:100px;
    top:100px;

    width:90px;
    height:90px;

    z-index:99999;
    pointer-events:none;
}

/* Corpo */
.pato-corpo{
    position:absolute;
    width:55px;
    height:50px;
    background:#ffd54f;
    border-radius:50%;
    left:15px;
    top:25px;
}

/* Cabeça */
.pato-cabeca{
    position:absolute;
    width:35px;
    height:35px;
    background:#ffe082;
    border-radius:50%;
    left:50px;
    top:8px;
}

/* Olho */
.pato-olho{
    position:absolute;
    width:4px;
    height:4px;
    background:#000;
    border-radius:50%;
    top:12px;
    left:20px;

    animation:piscar 4s infinite;
}

/* Bico */
.pato-bico{
    position:absolute;
    width:16px;
    height:8px;
    background:orange;
    border-radius:10px;
    top:18px;
    left:28px;
}

/* Pernas */
.perna{
    position:absolute;
    width:4px;
    height:18px;
    background:orange;
    bottom:8px;

    transform-origin:top center;

    animation:andar 0.18s infinite alternate;
}

.perna1{
    left:30px;
}

.perna2{
    left:45px;
    animation-delay:.18s;
}

.pe{
    position:absolute;
    width:12px;
    height:4px;
    background:orange;
    bottom:-2px;
    left:-4px;
    border-radius:10px;
}

/* Caminhada */
@keyframes andar{
    from{
        transform:rotate(35deg);
    }
    to{
        transform:rotate(-35deg);
    }
}

/* Piscar */
@keyframes piscar{
    0%,96%,100%{
        transform:scaleY(1);
    }
    98%{
        transform:scaleY(.1);
    }
}

/* Balanço */
@keyframes balanco{
    0%{
        transform:translateY(0px) rotate(-2deg);
    }
    50%{
        transform:translateY(-3px) rotate(0deg);
    }
    100%{
        transform:translateY(0px) rotate(2deg);
    }
}

.pato-animado{
    animation:balanco .3s infinite;
}

</style>

<div id="pato">

    <div class="pato-animado">

        <div class="pato-corpo"></div>

        <div class="pato-cabeca">
            <div class="pato-olho"></div>
            <div class="pato-bico"></div>
        </div>

        <div class="perna perna1">
            <div class="pe"></div>
        </div>

        <div class="perna perna2">
            <div class="pe"></div>
        </div>

    </div>

</div>

<script>

const pato = document.getElementById("pato");

let mouseX = window.innerWidth/2;
let mouseY = window.innerHeight/2;

let patoX = 100;
let patoY = 100;

document.addEventListener("mousemove",(e)=>{

    mouseX = e.clientX;
    mouseY = e.clientY;

});

function animar(){

    let dx = mouseX - patoX;
    let dy = mouseY - patoY;

    let distancia = Math.sqrt(dx*dx + dy*dy);

    /* velocidade */
    if(distancia > 5){

        patoX += dx * 0.04;
        patoY += dy * 0.04;

    }

    /* virar */
    if(dx < 0){

        pato.style.transform = "scaleX(-1)";

    }else{

        pato.style.transform = "scaleX(1)";

    }

    pato.style.left = patoX + "px";
    pato.style.top = patoY + "px";

    requestAnimationFrame(animar);

}

animar();

</script>
