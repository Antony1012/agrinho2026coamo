<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgriNova - Pato Inteligente</title>

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* BODY */
body{
    font-family:Arial, sans-serif;
    background:#f4f8f2;
    color:#333;
    overflow-x:hidden;
}

/* HEADER */
header{
    background:linear-gradient(90deg,#2e7d32,#43a047);
    color:white;
    padding:20px 40px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h1{
    font-size:2rem;
}

/* MENU */
nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-weight:bold;
}

/* SECTIONS */
section{
    background:white;
    width:85%;
    margin:30px auto;
    padding:25px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

/* SERVIÇOS */
#servicos{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:30px;
}

/* TEXTO */
.texto-servicos{
    width:50%;
}

/* LISTA */
#servicos ul{
    list-style:none;
}

#servicos li{
    background:#e8f5e9;
    margin-bottom:10px;
    padding:10px;
    border-left:5px solid #2e7d32;
    border-radius:6px;
}

/* GRÁFICO */
.grafico-area{
    width:40%;
    display:flex;
    justify-content:center;
}

.grafico-circulo{
    width:220px;
    height:220px;
    border-radius:50%;

    background:
    conic-gradient(
        #2e7d32 0% 40%,
        #66bb6a 40% 70%,
        #a5d6a7 70% 100%
    );

    position:relative;
}

.grafico-circulo::after{
    content:"AgriNova";

    position:absolute;
    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:110px;
    height:110px;

    border-radius:50%;
    background:white;

    display:flex;
    justify-content:center;
    align-items:center;

    color:#2e7d32;
    font-weight:bold;
}

/* FOOTER */
footer{
    text-align:center;
    background:#1b5e20;
    color:white;
    padding:15px;
    margin-top:30px;
}

/* PATO */
#pato{
    position:fixed;
    left:100px;
    top:100px;

    font-size:80px;

    z-index:9999;

    transition:
    left 0.25s linear,
    top 0.25s linear,
    transform 0.2s;
}

/* PARTÍCULAS */
.particula{
    position:fixed;
    font-size:20px;
    pointer-events:none;

    animation:sumir 1s forwards;
}

@keyframes sumir{

    from{
        opacity:1;
        transform:translateY(0px);
    }

    to{
        opacity:0;
        transform:translateY(-40px);
    }

}

/* RESPONSIVO */
@media(max-width:768px){

    #servicos{
        flex-direction:column;
    }

    .texto-servicos,
    .grafico-area{
        width:100%;
    }

}

</style>
</head>

<body>

<header>
    <h1>AgriNova</h1>

    <nav>
        <a href="#">Sobre</a>
        <a href="#">Serviços</a>
    </nav>
</header>

<section>
    <h2>Sobre a AgriNova</h2>

    <p>
        Empresa focada em tecnologia agrícola e inovação sustentável.
    </p>
</section>

<section id="servicos">

    <div class="texto-servicos">

        <h2>Serviços</h2>

        <ul>
            <li>Monitoramento IoT</li>
            <li>Irrigação inteligente</li>
            <li>Consultoria agrícola</li>
            <li>Análise de solo</li>
        </ul>

    </div>

    <div class="grafico-area">
        <div class="grafico-circulo"></div>
    </div>

</section>

<footer>
    © 2026 AgriNova
</footer>

<!-- PATO -->
<div id="pato">🦆</div>

<script>

const pato = document.getElementById("pato");

let mouseX = 0;
let mouseY = 0;

let patoX = 100;
let patoY = 100;

/* POSIÇÃO DO MOUSE */
document.addEventListener("mousemove", (e)=>{

    mouseX = e.clientX;
    mouseY = e.clientY;

});

/* PARTÍCULAS */
function criarParticula(x,y){

    const p = document.createElement("div");

    p.classList.add("particula");

    p.innerHTML = "💨";

    p.style.left = x + "px";
    p.style.top = y + "px";

    document.body.appendChild(p);

    setTimeout(()=>{
        p.remove();
    },1000);

}

/* IA DO PATO */
function atualizar(){

    let dx = mouseX - patoX;
    let dy = mouseY - patoY;

    let distancia = Math.sqrt(dx*dx + dy*dy);

    /* segue o mouse */
    if(distancia > 120){

        patoX += dx * 0.03;
        patoY += dy * 0.03;

    }

    /* foge quando chega perto */
    if(distancia < 100){

        patoX -= dx * 0.08;
        patoY -= dy * 0.08;

        criarParticula(patoX,patoY);

    }

    /* limites da tela */
    patoX = Math.max(0, Math.min(window.innerWidth - 80, patoX));
    patoY = Math.max(0, Math.min(window.innerHeight - 80, patoY));

    /* direção */
    if(dx < 0){
        pato.style.transform = "scaleX(-1)";
    }else{
        pato.style.transform = "scaleX(1)";
    }

    pato.style.left = patoX + "px";
    pato.style.top = patoY + "px";

    requestAnimationFrame(atualizar);

}

atualizar();

</script>

</body>
</html>
